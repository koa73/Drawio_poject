version: 1
plugin:
  id: seaf_plugin
  name: SEAF Plugin
  description: Minimal bootstrap plugin runtime
  runtimeVersion: 0.0.7
logging:
  level: info
  extendedDebug: false
  includePayload: false
  output: both
  filePath: ../log/seaf-plugin.log
update:
  enabled: true
  mode: ssh_git
  repo: ""
  gitRepoSsh: git@github.com:koa73/seaf-plugin-runtime.git
  gitRef: master
  assetPath: release/out/seaf-plugin-runtime.tar.gz
  expectedMinVersion: 0.2.6
  ssh:
    privateKeyPath: ../keys/seaf-plugin-runtime
    publicKeyPath: ../keys/seaf-plugin-runtime.pub
  assetName: seaf-plugin-runtime.tar.gz
  tag: ""
  apiBaseUrl: https://api.github.com
commands:
  - id: seafPlaceholderNoop
    title: SEAF Placeholder
    menu:
      main:
        enabled: false
        section: seaf
      context:
        enabled: false
        target: any
    script: noop.py
    execution:
      mode: sync
      timeoutSec: 1
    input:
      includeDiagramXml: false
    output:
      expectedStatus: success
