version: 1
plugin:
  id: seaf_plugin
  name: SEAF Plugin
  description: Minimal bootstrap plugin runtime
  runtimeVersion: 0.0.9
logging:
  level: info
  extendedDebug: false
  includePayload: false
  output: both
  filePath: ../log/seaf-plugin.log
update:
  enabled: true
  mode: github_release
  repo: koa73/seaf-plugin-runtime
  expectedMinVersion: 0.2.6
  assetName: seaf-plugin-runtime.tar.gz
  tag: latest
  apiBaseUrl: https://api.github.com
commands:
  - id: seafPlaceholderNoop
    title: SEAF Placeholder
    menu:
      main:
        enabled: false
        section: seaf
      context:
        enabled: false
        target: any
    script: noop.py
    execution:
      mode: sync
      timeoutSec: 1
    input:
      includeDiagramXml: false
    output:
      expectedStatus: success
