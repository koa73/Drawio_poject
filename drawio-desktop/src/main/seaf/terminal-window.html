<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEAF Interactive Terminal</title>
<style>
html, body {
	height: 100%;
	margin: 0;
	background: #111111;
	color: #f5f5f5;
	font-family: Arial, sans-serif;
}

body {
	display: flex;
	flex-direction: column;
}

#terminalRoot {
	display: flex;
	flex: 1 1 auto;
	flex-direction: column;
	min-height: 0;
}

#terminalStatus {
	flex: 0 0 auto;
	padding: 8px 12px;
	font-size: 12px;
	color: #d0d0d0;
	border-bottom: 1px solid rgba(255, 255, 255, 0.12);
	background: #1b1b1b;
}

#terminal {
	flex: 1 1 auto;
	min-height: 0;
	padding: 8px;
}
</style>
</head>
<body>
	<div id="terminalRoot">
		<div id="terminalStatus">Connecting to interactive session...</div>
		<div id="terminal"></div>
	</div>
	<script src="./terminal-window.js"></script>
</body>
</html>
