name: Build and Release

on:
  push:
    tags:
      - 'v*' # Запускается автоматически при создании тега, начинающегося с 'v' (например, v1.0.0)

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Используйте версию, совместимую с draw.io

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish
        env:
          # Этот токен GitHub предоставляет автоматически, он нужен для загрузки в Releases
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist
        # Примечание: в оригинальном draw.io команда может называться иначе,
        # проверьте секцию "scripts" в их package.json (часто это "npm run dist" или "npm run release")