name: Build and Release Drawio

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: drawio-desktop

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_command: npm run release-linux
          - os: windows-latest
            build_command: npm run release-win
          - os: macos-latest
            build_command: npx electron-builder --config electron-builder-linux-mac.json --publish always --mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: drawio-desktop/package-lock.json

      - name: Fix drawio link (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          rm -f drawio
          ln -s ../drawio-standalone drawio

      - name: Fix drawio link (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path drawio) { Remove-Item drawio -Force -Recurse }
          New-Item -Path drawio -ItemType Junction -Target ..\drawio-standalone | Out-Null

      - name: Set version from tag
        shell: node {0}
        run: |
          const fs = require('fs');
          const pkgPath = 'package.json';
          const rawTag = process.env.GITHUB_REF_NAME || '';
          const version = rawTag.startsWith('v') ? rawTag.slice(1) : rawTag;
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          console.log(`Using release version: ${version}`);

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick xz-utils rpm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.build_command }}